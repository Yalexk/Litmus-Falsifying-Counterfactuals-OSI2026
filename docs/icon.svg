<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Litmus: a test strip dipped into a drop; the wet end has changed colour. -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#1E293B"/>
  <g transform="translate(-28 -34) rotate(-24 256 256)">
    <!-- strip body -->
    <rect x="196" y="56" width="120" height="330" rx="22" fill="#F7F6F2"/>
    <!-- dipped end, changed colour -->
    <path d="M196 262 H316 V364 a22 22 0 0 1 -22 22 H218 a22 22 0 0 1 -22 -22 Z" fill="#C23B5A"/>
    <!-- transition band -->
    <rect x="196" y="232" width="120" height="30" fill="#0E9F88"/>
    <!-- grip lines -->
    <rect x="226" y="96" width="60" height="10" rx="5" fill="#8FA3C0"/>
    <rect x="226" y="122" width="60" height="10" rx="5" fill="#8FA3C0"/>
  </g>
  <!-- drop -->
  <path d="M372 350 C372 350 416 400 416 428 a44 44 0 0 1 -88 0 C328 400 372 350 372 350 Z" fill="#6E8FD1"/>
  <circle cx="356" cy="428" r="10" fill="#C9D3E3" opacity="0.7"/>
</svg>
